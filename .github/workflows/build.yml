# ============================================================
#  CI：在 GitHub 的 Windows 运行器上做一次干净构建 + 自检
#
#  为什么用 windows-latest：本项目只依赖 Windows 自带的
#  .NET Framework 4.x 编译器（csc.exe）与 Win32 API，
#  不需要安装 .NET SDK，也没有跨平台构建的必要。
#
#  quick 模式跑 103 项检查（只读 + 开销实测）；
#  smoke 模式真实构造一次主窗口（18 项），覆盖界面初始化路径。
#  两者合计若有一项失败，工作流即失败。
# ============================================================
name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示编译器版本
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          if (-not (Test-Path $csc)) { throw "找不到 csc.exe（运行器上没有 .NET Framework 4.x？）" }
          & $csc /? | Select-String -Pattern "version"

      - name: 校验源码编码与行尾（UTF-8 BOM + CRLF）
        shell: pwsh
        run: ./tools/check-encoding.ps1

      - name: 构建正式版
        shell: pwsh
        run: ./build.ps1

      - name: 校验产物（清单 / 图标 / 无第三方依赖）
        shell: pwsh
        run: ./tools/verify-build.ps1

      - name: 构建自检程序
        shell: pwsh
        run: ./build-test.ps1

      - name: 自检（103 项）
        shell: pwsh
        run: |
          ./dist/MemTrimTest.exe quick
          if ($LASTEXITCODE -ne 0) { throw "自检失败（exit $LASTEXITCODE）" }

      - name: 界面烟雾测试（18 项）
        shell: pwsh
        run: |
          ./dist/MemTrimTest.exe smoke
          if ($LASTEXITCODE -ne 0) { throw "烟雾测试失败（exit $LASTEXITCODE）" }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MemTrim-exe
          path: dist/MemTrim.exe
          if-no-files-found: error
